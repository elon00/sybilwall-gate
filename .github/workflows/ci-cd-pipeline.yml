name: Offline Peer Observation Regression
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and run Rust unit tests (offline)
        run: cargo test --offline
      - name: Compile Python test sources (fail closed)
        run: python -m compileall -q tests
      - name: Execute real Rust CLI subprocess regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
